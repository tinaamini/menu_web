<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}کافه گاردو{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,400&family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    {% load static %}
    <!-- آیکون نشان گاردو در تب مرورگر (Favicon) -->
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'images/favicon-32x32.png' %}?v=2.0">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'images/favicon-16x16.png' %}?v=2.0">
    <link rel="shortcut icon" href="{% static 'images/favicon.ico' %}?v=2.0">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'images/apple-touch-icon.png' %}?v=2.0">
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=327.0">
    <style>
      /* مخفی‌سازی کامل و قطعی نوار اسکرول مرورگر در تمامی دستگاه‌ها و مرورگرها */
      html, body {
        scrollbar-width: none !important;
        -ms-overflow-style: none !important;
      }
      ::-webkit-scrollbar,
      html::-webkit-scrollbar,
      body::-webkit-scrollbar,
      *::-webkit-scrollbar {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
        background: transparent !important;
      }
      ::-webkit-scrollbar-thumb,
      ::-webkit-scrollbar-track {
        display: none !important;
        background: transparent !important;
      }
      * {
        scrollbar-width: none !important;
        -ms-overflow-style: none !important;
      }

      /* مخفی‌سازی کامل و قطعی فلش‌ها/نوار نشانگر اسکرول هیرو */
      .hero-scroll-indicator,
      #heroScrollIndicator {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
    </style>
</head>
<body>

    <!-- محتوا -->
    <main>
        {% block content %}{% endblock %}
    </main>

 

    <script src="{% static 'js/main.js' %}?v=316.0"></script>
</body>
</html>
