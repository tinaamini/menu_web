{% load auth %}
<div{% include 'django/forms/widgets/attrs.html' %}>
  <div class="password-hash-render" style="margin-bottom: 8px;">
    {% render_password_as_hash widget.value %}
  </div>
  <p><a role="button" class="button" href="{{ password_url|default:"../password/" }}">تغییر گذرواژه این کاربر</a></p>
</div>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const el = document.querySelector('.password-hash-render');
    if (el) {
        el.innerHTML = el.innerHTML
            .replace(/<strong>salt<\/strong>/gi, '<strong>نمک امنیتی (salt)</strong>')
            .replace(/<strong>hash<\/strong>/gi, '<strong>کد هش امنیتی (hash)</strong>');
    }
});
</script>
